; agri-temp-wifi — multi-point 1-Wire temperature node (DS18B20 xN), WiFi flavour
;
; Two boards, one source tree. Everything board-specific is in src/board.h plus
; the -D flags below; sensors/mqtt/ccm/webui/self_update are board-agnostic.
;
;   [env:m5atoms3-wifi]  M5Stack AtomS3 Lite (ESP32-S3)     <- default
;   [env:m5atomu-wifi]   M5Stack ATOM U      (ESP32-PICO-D4)
;
; No PoE base on either: agri-node-poe-core is ETH/W5500-bound and cannot be
; used here, so MQTT/CCM/WebUI are reimplemented in src/ with the same
; conventions, exactly as in agri-amp-wifi. The PoE sibling of this node is
; agri-temp-poe (AtomS3 Lite + Atomic PoE base).
;
; Wiring (both boards): N x DS18B20 on one 1-Wire bus, 4.7k pull-up to 3.3V.
; The Grove DS18B20 unit (Switch Science 10979) has the pull-up built in; a
; bare probe soldered to the ATOM U does not. See README "配線".
;
; Toolchain: espressif32 6.x (= arduino-esp32 2.0.x) for both envs, matching
; agri-amp-wifi — the WiFiManager captive portal and the WebServer-based
; webui.h are known-good there. Only the W5500 PoE nodes need the 3.x
; pioarduino fork, and neither env here touches Ethernet.

[platformio]
; The ATOM U unit is shelved (its 1-Wire bus never answered — wiring pending),
; so a bare `pio run` targets the board that is actually on the bench.
default_envs = m5atoms3-wifi

[common]
platform = espressif32@^6.9.0
framework = arduino
monitor_speed = 115200
build_flags = -DCORE_DEBUG_LEVEL=3
lib_deps =
	fastled/FastLED
	tzapu/WiFiManager
	knolleary/PubSubClient
	bblanchon/ArduinoJson@^7.0.0
	paulstoffregen/OneWire
	milesburton/DallasTemperature

; ---------------------------------------------------------------------------
; M5Stack AtomS3 Lite (ESP32-S3-PICO-1, 8 MB flash)
; ---------------------------------------------------------------------------
[env:m5atoms3-wifi]
platform      = ${common.platform}
board         = m5stack-atoms3
framework     = ${common.framework}
monitor_speed = ${common.monitor_speed}
lib_deps      = ${common.lib_deps}

; No board_build.partitions here on purpose. The ATOM U needs min_spiffs to fit
; the TLS-heavy self-update image into a 4 MB layout; the AtomS3 has 8 MB and
; the board's own default_8MB.csv already gives two 3.3 MB OTA slots — roughly
; three times the headroom, with the SPIFFS partition left intact.

; USB-C native CDC/JTAG — there is no USB-UART bridge on this board, so esptool
; talks to the ROM over the S3's own USB peripheral. The baud rate is cosmetic
; on a CDC link (it is not a real UART), so the ATOM U's 115200 ceiling does not
; apply; the board manifest's 460800 is used.
build_flags =
	${common.build_flags}
	-DBOARD_ATOMS3
	; Serial = native USB CDC, which must be up before setup() runs.
	-DARDUINO_USB_CDC_ON_BOOT=1
	; 1-Wire DATA defaults to the Grove port's white wire — see src/board.h for
	; why it is G1 and not the G2 the silkscreen implies. Overridable at runtime
	; in the WebUI (/config); this is only the value a blank NVS starts from.
	-DOW_DEFAULT_PIN=1
	; GitHub release asset for THIS board. It must differ from the ATOM U's:
	; the two images are different architectures, and self_update.h downloads
	; strictly by file name from the same release.
	-DFW_BIN_NAME_STR='"agri-temp-wifi-atoms3.bin"'

; ---------------------------------------------------------------------------
; M5Stack ATOM U (ESP32-PICO-D4, 4 MB flash, USB-A plug)
; ---------------------------------------------------------------------------
; Bench identity: chip ESP32-PICO-D4 rev v1.0, MAC 4c:75:25:c7:2b:0c, on COM3
; via an FTDI FT232R adapter.
[env:m5atomu-wifi]
platform      = ${common.platform}
board         = m5stack-atom
framework     = ${common.framework}
monitor_speed = ${common.monitor_speed}

lib_deps =
	${common.lib_deps}
	; ESP32-only: hard-codes the PICO-D4's pins and pulls in an MPU6886 driver
	; with no S3 path. Deliberately absent from the AtomS3 env.
	m5stack/M5Atom

; GitHub self-update pulls in WiFiClientSecure/mbedTLS, which took the image
; from 77.7% to 90.4% of the stock 1.31 MB app partition — too little headroom
; to add anything later, and a self-update has to fit in the *other* app slot.
; min_spiffs keeps the two OTA slots (mandatory for self-update) but grows each
; to 1.9 MB, trading away the SPIFFS partition this node never uses.
;
; NOTE: the partition table lives outside the app image, so an OTA cannot
; change it. Moving an already-deployed node onto this layout needs one USB
; flash; after that OTA works normally again.
board_build.partitions = min_spiffs.csv

; FTDI FT232R on COM3. Both 921600 and 460800 die with "Unable to verify flash
; chip connection (No serial data received)" immediately after esptool switches
; the baud rate — this adapter/cable only survives the default 115200. Slow
; (~90 s for a 1 MB image) but reliable; USB flashing is a one-off anyway,
; everything after that goes over HTTP OTA.
upload_speed = 115200

build_flags =
	${common.build_flags}
	-DBOARD_ATOMU
	; Matches the original M5Atom-ds18b20_influxdb sketch this node replaced.
	-DOW_DEFAULT_PIN=25
	-DFW_BIN_NAME_STR='"agri-temp-wifi.bin"'
