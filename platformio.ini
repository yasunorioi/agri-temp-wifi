; agri-temp-wifi — M5 AtomU multi-point 1-Wire temperature node (DS18B20 xN)
;
; Hardware
;   - M5Stack ATOM U (ESP32-PICO-D4, USB-A plug). Confirmed on the bench:
;     chip ESP32-PICO-D4 rev v1.0, MAC 4c:75:25:c7:2b:0c, on COM3 via an
;     FTDI FT232R adapter.
;   - N x DS18B20 on a single 1-Wire bus, DATA = G25 (same pin the original
;     M5Atom-ds18b20_influxdb sketch used), with a 4.7k pull-up. See README
;     "配線" — the pull-up rail matters.
;   - No PoE base: the ATOM U has no bottom expansion, so this node is WiFi,
;     like agri-amp-wifi. agri-node-poe-core is ETH/W5500-bound and cannot be
;     used here; MQTT/CCM/WebUI are reimplemented in src/ (same conventions).
;
; Toolchain note: pinned to espressif32 6.x (= arduino-esp32 2.0.x) to match
; agri-amp-wifi, the other WiFi member — the M5Atom library and the WebServer
; based webui.h are known-good there. Nothing here needs the 3.x pioarduino
; fork that the W5500 PoE nodes require.

[env:m5atomu-wifi]
platform = espressif32@^6.9.0
board = m5stack-atom
framework = arduino
monitor_speed = 115200

; GitHub self-update pulls in WiFiClientSecure/mbedTLS, which took the image
; from 77.7% to 90.4% of the stock 1.31 MB app partition — too little headroom
; to add anything later, and a self-update has to fit in the *other* app slot.
; min_spiffs keeps the two OTA slots (mandatory for self-update) but grows each
; to 1.9 MB, trading away the SPIFFS partition this node never uses.
;
; NOTE: the partition table lives outside the app image, so an OTA cannot
; change it. Moving an already-deployed node onto this layout needs one USB
; flash; after that OTA works normally again.
board_build.partitions = min_spiffs.csv
; FTDI FT232R on COM3. Both 921600 and 460800 die with "Unable to verify flash
; chip connection (No serial data received)" immediately after esptool switches
; the baud rate — this adapter/cable only survives the default 115200. Slow
; (~90 s for a 1 MB image) but reliable; USB flashing is a one-off anyway,
; everything after that goes over HTTP OTA.
upload_speed = 115200

build_flags =
	-DCORE_DEBUG_LEVEL=3

lib_deps =
	m5stack/M5Atom
	fastled/FastLED
	tzapu/WiFiManager
	knolleary/PubSubClient
	bblanchon/ArduinoJson@^7.0.0
	paulstoffregen/OneWire
	milesburton/DallasTemperature
